# Define upstream for backend replicas to allow NGINX to load balance
upstream backend_servers {
    server backend:5000;
}

server {
    listen 80;

    # Serve the React frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Handle client-side routing in React
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend servers
    location /api/ {
        # Rewrite the URL by removing the /api prefix before passing it to the backend
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend_servers;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
